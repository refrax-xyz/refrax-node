name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: devnet smoke test
        shell: bash
        run: |
          cargo build --release --locked -p refrax-cli
          ./target/release/refrax devnet up --dir "$RUNNER_TEMP/devnet" > devnet.log 2>&1 &
          sleep 2
          head -c 300000 /dev/urandom > sample.bin
          ID=$(./target/release/refrax put sample.bin | grep -oE 'refrax get [1-9A-HJ-NP-Za-km-z]+' | awk '{print $3}')
          ./target/release/refrax get "$ID" -o restored.bin
          cmp sample.bin restored.bin
          ./target/release/refrax audit "$ID"
          ./target/release/refrax status

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: refrax-node:ci
