name: Bug report
description: Something in the node, the CLI or the devnet does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues do not belong here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
      placeholder: |
        refrax put ./video.mp4
        expected: certified
        got: error: registry 409: committee has 15 of 16 seats filled
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output and logs
      description: Run with REFRAX_LOG=refrax_node=debug and paste the relevant part.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `refrax --version`
      placeholder: refrax 0.1.0
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [local devnet, single node, docker, other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04 x86_64
